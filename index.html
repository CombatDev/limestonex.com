<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LimeStoneX - Maintenance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #22c55e;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #d1d5db;
        }

        .status {
            margin-top: 25px;
            padding: 10px 20px;
            display: inline-block;
            border: 2px solid #22c55e;
            border-radius: 8px;
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LimeStoneX</h1>

        <p>
            Our website is currently undergoing maintenance and improvements.
            We are working to bring new features and content online soon.
        </p>

        <div class="status">
            Site Under Maintenance
        </div>

        <p style="margin-top: 30px; font-size: 0.9rem;">
            © 2026 LimeStoneX. All rights reserved.
        </p>
    </div>
</body>
</html>
