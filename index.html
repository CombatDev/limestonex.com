<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(
        rgba(20,40,20,0.6),
        rgba(20,40,20,0.7)
    ),
    url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920");
    background-size: cover;
    background-position: center;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    background: rgba(0,0,0,0.45);
    padding: 50px;
    border-radius: 20px;
    max-width: 700px;
    backdrop-filter: blur(5px);
}

h1 {
    font-size: 4rem;
    margin-bottom: 20px;
}

p {
    font-size: 1.2rem;
    line-height: 1.6;
    margin-bottom: 25px;
}

.badge {
    display: inline-block;
    padding: 12px 24px;
    background: #2e8b57;
    border-radius: 30px;
    font-weight: bold;
}

footer {
    margin-top: 30px;
    font-size: 0.9rem;
    opacity: 0.8;
}
</style>
</head>
<body>

<div class="container">
    <h1>🏕️ Adventure is Coming</h1>

    <p>
        We're currently working on a brand new outdoor experience.
        New trails, fresh content, and exciting updates are on the way.
    </p>

    <div class="badge">
        🚧 Website Under Construction
    </div>

    <footer>
        © 2026 Your Brand Name
    </footer>
</div>

</body>
</html>
